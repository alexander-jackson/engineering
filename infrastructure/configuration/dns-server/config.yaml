server:
  dns:
    host: 0.0.0.0
    port: 853
  http:
    host: 0.0.0.0
    port: 80

upstream:
  resolver: family.cloudflare-dns.com
  port: 443
  protocol: https
  timeout_seconds: 5

remote_blocklist:
  url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro-onlydomains.txt

cache:
  max_entries: 10000
  default_ttl_seconds: 300
  error_ttl_seconds: 60

metrics:
  endpoint: http://prometheus.mesh.internal/api/v1/otlp/v1/metrics
  interval_seconds: 30

database:
  host: rds.mesh.internal
  port: 5432

  root:
    username: postgres
    password: {{  }}
    database: postgres

  application:
    username: dnsserverblue
    password: {{  }}
    database: dnsserver

classifier:
  api_key: {{  }}
  model: typesafe/jev-1.14
  timeout_seconds: 8
  max_content_chars: 8000
  rollout_percentage: 100

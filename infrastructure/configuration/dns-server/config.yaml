server:
  dns:
    host: 0.0.0.0
    port: 853
  http:
    host: 0.0.0.0
    port: 80

upstream:
  resolver: all.dns.mullvad.net
  port: 443
  protocol: https
  timeout_seconds: 5

cache:
  max_entries: 10000
  default_ttl_seconds: 300
  error_ttl_seconds: 60

metrics:
  endpoint: http://prometheus.mesh.internal/api/v1/otlp/v1/metrics
  interval_seconds: 30

database:
  host: rds.mesh.internal
  port: 5432

  root:
    username: postgres
    password: {{  }}
    database: postgres

  application:
    username: dnsserverblue
    password: {{  }}
    database: dnsserver

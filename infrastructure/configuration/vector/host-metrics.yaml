sources:
  host:
    type: host_metrics
    scrape_interval_secs: 15
    collectors: [cpu, memory, filesystem, network, load, disk]
    filesystem:
      mountpoints:
        excludes:
          # Container overlays are unreadable by the `vector` user and are noise anyway
          - /var/lib/docker/**
          - /run/docker/**

transforms:
  drop_nan:
    type: filter
    inputs: [host]
    # NaN on zero-size pseudo-filesystems (/proc, /sys, /dev/pts) fails OTLP encoding
    condition: .name != "filesystem_used_ratio"

  ec2:
    type: aws_ec2_metadata
    inputs: [drop_nan]
    fields: [instance-id, instance-type, availability-zone, region]
    required: false

sinks:
  prometheus:
    type: opentelemetry
    inputs: [ec2]
    protocol:
      type: http
      uri: http://prometheus.mesh.internal/api/v1/otlp/v1/metrics
      method: post
      encoding:
        codec: otlp

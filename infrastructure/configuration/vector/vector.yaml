data_dir: "/var/lib/vector"

sources:
  docker:
    type: docker_logs
    docker_host: /var/run/docker.sock

  host:
    type: host_metrics
    scrape_interval_secs: 15
    collectors: [cpu, memory, filesystem, network, load, disk]
    filesystem:
      mountpoints:
        excludes:
          # Container overlays are unreadable by the `vector` user and are noise anyway
          - /var/lib/docker/**
          - /run/docker/**

transforms:
  parse_logs:
    type: remap
    inputs:
      - docker
    drop_on_error: false
    source: |
      if is_string(.message) {
        parsed, err = parse_json(.message)

        if err == null && is_object(parsed) {
          .log_format = "json"
          .log = parsed

          message, err = string(parsed.message)
          if err == null {
            .message = message
            del(.log.message)
          } else {
            message, err = string(parsed.msg)
            if err == null {
              .message = message
              del(.log.msg)
            }
          }
        } else {
          .log_format = "text"
          .message = strip_ansi_escape_codes(.message) ?? .message
        }
      }

  normalise_logs:
    type: remap
    inputs:
      - parse_logs
    drop_on_error: false
    source: |
      image = string(.image) ?? ""
      parts = parse_regex(image, r'^(?P<name>.+?)(?::(?P<tag>[^:/]+))?$') ?? {}

      level = null
      target = null
      fields = {}

      if is_object(.log) {
        fields = object(.log) ?? {}

        if is_string(fields.level) {
          level = upcase(string(fields.level) ?? "")
          del(fields.level)
        }

        if is_string(fields.target) {
          target = fields.target
          del(fields.target)
        } else if is_string(fields.logger) {
          target = fields.logger
          del(fields.logger)
        }
      }

      . = {
        "timestamp": .timestamp,
        "image_name": string(parts.name) ?? image,
        "image_tag": string(parts.tag) ?? "latest",
        "container_name": .container_name,
        "container_id": .container_id,
        "container_created": .container_created_at,
        "host": .host,
        "stream": .stream,
        "level": level,
        "target": target,
        "message": .message,
        "fields": fields,
      }

  # NaN on zero-size pseudo-filesystems (/proc, /sys, /dev/pts) fails OTLP encoding
  drop_nan:
    type: filter
    inputs:
      - host
    condition: .name != "filesystem_used_ratio"

  ec2:
    type: aws_ec2_metadata
    inputs:
      - drop_nan
    fields: [instance-id, instance-type, availability-zone, region]
    required: false

sinks:
  s3:
    type: aws_s3
    batch:
      timeout_secs: 3600
    bucket: logging-4acb18
    encoding:
      codec: json
    inputs:
      - parse_logs

  beaver:
    type: http
    uri: http://beaver.mesh.internal/logs
    compression: gzip
    batch:
      max_events: 1000
      timeout_secs: 5
    buffer:
      type: disk
      max_size: 536870912
      when_full: block
    encoding:
      codec: json
    inputs:
      - normalise_logs

  prometheus:
    type: opentelemetry
    inputs:
      - ec2
    protocol:
      type: http
      uri: http://prometheus.mesh.internal/api/v1/otlp/v1/metrics
      method: post
      encoding:
        codec: otlp

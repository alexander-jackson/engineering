data_dir: "/var/lib/vector"

sources:
  docker:
    type: docker_logs
    docker_host: /var/run/docker.sock

transforms:
  parse_logs:
    type: remap
    inputs:
      - docker
    drop_on_error: false
    source: |
      if is_string(.message) {
        parsed, err = parse_json(.message)

        if err == null && is_object(parsed) {
          .log_format = "json"
          .log = parsed

          message, err = string(parsed.message)
          if err == null {
            .message = message
            del(.log.message)
          }
        } else {
          .log_format = "text"
          .message = strip_ansi_escape_codes(.message) ?? .message
        }
      }

sinks:
  s3:
    type: aws_s3
    batch:
      timeout_secs: 3600
    bucket: logging-4acb18
    encoding:
      codec: json
    inputs:
      - parse_logs

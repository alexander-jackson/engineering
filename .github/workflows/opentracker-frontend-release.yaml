on:
  push:
    branches: ["master"]
    paths:
    - "apps/opentracker/frontend/**"
    - ".github/workflows/opentracker-frontend-release.yaml"

name: opentracker-frontend Release

jobs:
  setup:
    name: Generate Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Generate tag
        id: tag
        run: echo "value=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

  docker:
    name: Docker Build
    needs: setup
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/opentracker-frontend:${{ needs.setup.outputs.tag }}
          context: ./apps/opentracker/frontend

  notify:
    name: Notify tag-updater
    needs: [setup, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Inform `tag-updater`
        run: |
          curl --fail-with-body https://tags.opentracker.app/update \
            -X PUT \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.TAG_UPDATER_PASSPHRASE }}" \
            --data "{\"updates\": [{\"service\": \"opentracker-frontend\", \"tag\": \"${{ needs.setup.outputs.tag }}\"}]}"

on:
  push:
    branches: ["master"]
    paths:
      - 'apps/**'
      - '.github/workflows/release.yaml'

name: Release

jobs:
  setup:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      build-matrix: ${{ steps.detect.outputs.build-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: echo "value=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Detect changed apps
        id: detect
        run: |
          ALL_APPS='[
            {"name":"certmanager",         "path":"certmanager"},
            {"name":"dns-server",          "path":"dns-server"},
            {"name":"events",              "path":"events"},
            {"name":"f2",                  "path":"f2"},
            {"name":"lockers",             "path":"lockers"},
            {"name":"opentracker-backend", "path":"opentracker/backend"},
            {"name":"palate",              "path":"palate"},
            {"name":"pgmanager",           "path":"pgmanager"},
            {"name":"tag-updater",         "path":"tag-updater"},
            {"name":"today",               "path":"today"},
            {"name":"uptime",              "path":"uptime"}
          ]'

          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"

          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "First push or forced push — rebuilding all apps"
            APPS_JSON=$(echo "$ALL_APPS" | jq -c .)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA")
            echo "Changed files:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -qE '^apps/foundation/|^apps/Cargo\.lock$'; then
              echo "Foundation or Cargo.lock changed — rebuilding all apps"
              APPS_JSON=$(echo "$ALL_APPS" | jq -c .)
            else
              APPS_JSON=$(echo "$ALL_APPS" | jq -c --arg changed "$CHANGED" '
                [.[] | . as $app | select(
                  ($changed | split("\n") | any(startswith("apps/" + $app.path + "/")))
                )]
              ')
              echo "Apps to build: $APPS_JSON"
            fi
          fi

          BUILD_MATRIX=$(echo "$APPS_JSON" | jq -c '[.[] | {name: .name, path: .path}]')

          echo "build-matrix=$BUILD_MATRIX" >> $GITHUB_OUTPUT

  docker:
    name: Docker Build (${{ matrix.name }})
    needs: setup
    if: needs.setup.outputs.build-matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.build-matrix) }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ needs.setup.outputs.tag }}
          context: ./apps
          file: ./apps/${{ matrix.path }}/Dockerfile
      - name: Record successful build
        run: |
          mkdir -p built
          echo "${{ matrix.name }}" > "built/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.name }}
          path: built/${{ matrix.name }}

  notify:
    name: Notify tag-updater
    needs: [setup, docker]
    # Run even if some builds failed, so the successful ones still get deployed
    if: ${{ !cancelled() && needs.setup.outputs.build-matrix != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: built-*
          path: built
          merge-multiple: true
      - name: Notify tag-updater
        run: |
          if [[ -z "$(ls -A built 2>/dev/null)" ]]; then
            echo "No applications were built successfully, nothing to notify"
            exit 0
          fi

          PAYLOAD=$(ls built | jq -R --arg tag "${{ needs.setup.outputs.tag }}" \
            '{service: ., tag: $tag}' | jq -sc '{updates: .}')
          echo "Sending: $PAYLOAD"

          curl --fail-with-body https://tags.opentracker.app/update \
            -X PUT \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.TAG_UPDATER_PASSPHRASE }}" \
            --data "$PAYLOAD"

[package]
name = "dns-server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
axum.workspace = true
color-eyre = "0.6.5"
foundation-configuration = { version = "0.1.0", path = "../foundation/configuration" }
foundation-http-server = { version = "0.1.0", path = "../foundation/http-server", features = ["metrics"] }
foundation-init = { version = "0.1.0", path = "../foundation/init", features = ["database", "metrics"] }
foundation-shutdown = { version = "0.1.0", path = "../foundation/shutdown" }
foundation-templating = { version = "0.1.0", path = "../foundation/templating" }
foundation-uid = { version = "0.1.0", path = "../foundation/uid" }
hickory-net = { version = "0.26.1", features = ["serde"] }
hickory-proto = "0.26.1"
hickory-resolver = { version = "0.26.1", features = ["https-ring", "webpki-roots"] }
hickory-server = { version = "0.26.1", features = ["tls-ring"] }
moka = { version = "0.12.15", features = ["future"] }
openrouter-rs = "0.19.0"
opentelemetry = { workspace = true }
reqwest.workspace = true
scraper = "0.27.0"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.0", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tracing.workspace = true
uuid = { version = "1.28.0", features = ["serde", "v4"] }
wildcard-domains-parser = { git = "https://github.com/alexander-jackson/wildcard-domains-parser" }

[dev-dependencies]
dns-mock-server = "0.2.0"
http-body-util = "0.1.5"
serde_yaml = "0.9.34"
tower = { version = "0.5.3", features = ["util"] }

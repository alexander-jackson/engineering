server:
  dns:
    host: 0.0.0.0
    port: 853
  http:
    host: 0.0.0.0
    port: 80

upstream:
  resolver: family.cloudflare-dns.com
  port: 443
  protocol: https
  timeout_seconds: 5

cache:
  max_entries: 10000
  default_ttl_seconds: 300
  error_ttl_seconds: 60

remote_blocklist:
  url: https://example.com/hagezi-multi.txt

classifier:
  api_key: sk-or-example
  model: typesafe/jev-1.14
  timeout_seconds: 8
  max_content_chars: 8000
  rollout_percentage: 25

alb:
  addr: 0.0.0.0
  ports:
    http: 8080
    tls: 8853
  reconciliation: /reconcile
  tls:
    domains:
      old.example.com:
        cert_file:
          location: filesystem
          path: /resources/certificates/old.crt
        key_file:
          location: filesystem
          path: /resources/certificates/old.key

services:
  multimodal-echo:
    image: multimodal-echo
    tag: latest
    replicas: 1
    routes:
      - host: old.example.com
        protocol: tcp
        port: 8080
      - host: localhost:8080
        protocol: http
        port: 8081
